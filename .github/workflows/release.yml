name: Files release
on:
  push:
    tags: ['v*']
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    container: archlinux:base-devel
    steps:
      - run: pacman -Syu --noconfirm --needed git rust gtk4 gtksourceview5 poppler-glib gstreamer gst-plugins-base-libs fontconfig github-cli python openssl
      - uses: actions/checkout@v4
      - run: cargo build --release --locked
      - name: Package
        run: |
          package="package/nixe-files-${GITHUB_REF_NAME#v}"
          mkdir -p "$package/data/icons/scalable/apps"
          cp target/release/nixe-files target/release/nixe-files-rar LICENSE COPYING UPSTREAM.md THIRD_PARTY_LICENSES.md install-nixe.sh "$package/"
          cp data/io.github.design_nexus.nixe.Files.desktop "$package/"
          cp data/icons/scalable/apps/io.github.design_nexus.nixe.Files.svg "$package/"
          cp data/io.github.design_nexus.nixe.Files.desktop "$package/data/"
          cp data/icons/scalable/apps/io.github.design_nexus.nixe.Files.svg "$package/data/icons/scalable/apps/"
          cp rar-helper/LICENSE "$package/RAR-HELPER-LICENSE"
          printf '%s\n' "$GITHUB_SHA" > "$package/SOURCE_COMMIT"
          tar -czf nixe-files-${GITHUB_REF_NAME#v}-x86_64-unknown-linux-gnu.tar.gz -C package "nixe-files-${GITHUB_REF_NAME#v}"
          mkdir release-assets
          mv *.tar.gz release-assets/
          python scripts/sign_update_manifest.py --directory release-assets --version "${GITHUB_REF_NAME#v}" --source-commit "$GITHUB_SHA"
          cd release-assets
          sha256sum *.tar.gz *.json > SHA256SUMS
        env:
          UPDATE_SIGNING_KEY: ${{ secrets.UPDATE_SIGNING_KEY }}
      - run: gh release create "$GITHUB_REF_NAME" release-assets/* --generate-notes
        env:
          GH_TOKEN: ${{ github.token }}
