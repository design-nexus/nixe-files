name: Files build
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    container: archlinux:base-devel
    steps:
      - run: pacman -Syu --noconfirm --needed git rust gtk4 gtksourceview5 poppler-glib gstreamer gst-plugins-base-libs fontconfig
      - uses: actions/checkout@v4
      - run: cargo build --release --locked
